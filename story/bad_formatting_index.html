<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chain Story Platform</title>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #111827;          
      --surface: #1f2937;     
      --surface-2: #374151;   
      --border: #4b5563;      
      --text: #f3f4f6;        
      --text-body: #d1d5db;   
      --text-muted: #9ca3af;  
      --text-faint: #4b5563;  
      --accent: #fbbf24;      
      --accent-soft: #fde68a; 
      --success: #a3e635;     
      --danger: #ef4444;      
      --danger-text: #f87171; 
      --radius-card: 12px;
      --radius-modal: 16px;
      --radius-btn: 8px;
      --radius-field: 6px;
      --radius-pill: 999px;
      --shadow-modal: 0 16px 48px rgba(0, 0, 0, .65);
      --overlay: rgba(0, 0, 0, .72);
      --nav-bg: rgba(17, 24, 39, .92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-shell { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .app-header, .toolbar, .story-heading, .entry-meta { display: flex; align-items: center; gap: 12px; }
    .app-header, .story-heading { justify-content: space-between; }
    .toolbar { flex-wrap: wrap; margin-top: 16px; }
    .layout { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 20px; margin-top: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; }
    .panel h1, .panel h2, .panel h3 { margin-bottom: 12px; }
    .muted { color: var(--text-muted); }
    .stack { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .story-list { display: grid; gap: 10px; }
    .story-card { text-align: left; width: 100%; color: var(--text); cursor: pointer; }
    .entry { padding: 16px 0; border-top: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; }
    .entry-meta { justify-content: space-between; color: var(--text-muted); font-size: .85rem; margin-bottom: 10px; }
    .status { padding: 12px; border-radius: 8px; background: #422006; color: #fde68a; margin: 16px 0; }
    .error { color: var(--danger-text); }
    .brand { font-size: 1.35rem; font-weight: 750; }
    @media (max-width: 720px) {
      .app-shell { padding: 16px; }
      .layout { grid-template-columns: 1fr; }
      .app-header { align-items: flex-start; flex-direction: column; }
    }

    .slovol-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 2px solid var(--surface-2);
    }

    .slovol-card.active { border-color: var(--accent); }
    .slovol-card.complete { border-color: var(--success); }

    .slovol-btn {
      background: var(--surface-2);
      color: var(--text);
      border: none;
      border-radius: var(--radius-btn);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .slovol-btn:hover:not(:disabled) { background: var(--border); }
    .slovol-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .slovol-btn-primary {
      background: var(--accent);
      color: #111827;
      font-weight: 700;
    }

    .slovol-btn-primary:hover:not(:disabled) { background: #f59e0b; }

    .slovol-input, .slovol-select, .slovol-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-field);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .slovol-input:focus, .slovol-select:focus, .slovol-textarea:focus, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .slovol-chip {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #334155;
      color: #e5e7eb;
      border: 1px solid var(--border);
    }

    .slovol-chip-amber {
      background: #78350f;
      color: #fde68a;
      border-color: #d97706;
    }

    .slovol-chip-lime {
      background: #14532d;
      color: #bef264;
      border-color: #65a30d;
    }

    .slovol-chip-red {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #dc2626;
    }

    .slovol-quote {
      padding: 10px 14px;
      border-left: 3px solid var(--accent);
      background: var(--bg);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--accent-soft);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>
</head>

  <script type="application/x-disabled">
    const { useState, useMemo, useEffect } = React;

    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wFor1ik9pKpyHeUnojL4Yw_72mgpHfv';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const FeatherIcon = () => (

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [stories, setStories] = useState([]);

      // Story Creation Form State

      const [consecutiveMode, setConsecutiveMode] = useState('not_allowed');
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [initialPrompt, setInitialPrompt] = useState('');

      // Editor State
      const [newTurnText, setNewTurnText] = useState('');
      const [notifyOn, setNotifyOn] = useState(false); 

      // Claim Countdown State
      const [lockCountdown, setLockCountdown] = useState('');

      useEffect(() => {
        fetchStories();

        supabase.auth.getSession().then(({ data: { session } }) => {
          setCurrentUser(session?.user || null);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setCurrentUser(session?.user || null);
        });

        return () => subscription.unsubscribe();
      }, []);

      // Find currently selected story asset object
      const activeStory = useMemo(() => {
        return stories.find(s => s.id === activeStoryId) || null;
      }, [stories, activeStoryId]);

      // Running countdown interval if active story is locked
      useEffect(() => {
        if (!activeStory || !activeStory.claim_expires_at) {
          setLockCountdown('');
          return;
        }

        const checkLock = () => {
          const expires = new Date(activeStory.claim_expires_at).getTime();
          const now = Date.now();
          const diff = expires - now;

          if (diff <= 0) {
            setLockCountdown('');
            clearInterval(interval);
          } else {
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            setLockCountdown(`${minutes}m ${seconds}s`);
          }
        };

        checkLock();
        const interval = setInterval(checkLock, 1000);
        return () => clearInterval(interval);
      }, [activeStory, activeStoryId]);

      // Synchronize notification checkbox every time selected story switches over
      useEffect(() => {
        if (currentUser && activeStoryId) {
          supabase
            .from('story_subscribers')
            .select('*')
            .eq('story_id', activeStoryId)
            .eq('user_id', currentUser.id)
            .maybeSingle()
            .then(({ data }) => {
              setNotifyOn(!!data);
            });
        }
      }, [activeStoryId, currentUser]);

      const fetchStories = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('stories')
          .select('*, story_entries(*)')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Error fetching stories:', error);
        } else if (data) {
          const formatted = data.map(story => ({
            ...story,
            entries: (story.story_entries || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          }));
          setStories(formatted);
          if (formatted.length > 0 && !activeStoryId) {
            setActiveStoryId(formatted[0].id);
          }
        }
        setLoading(false);
      };

      // Handle standard Email Auth form flows
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMessage('');
        if (isSignUp) {
          const { error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: { data: { username: authUsername } }
          });
          if (error) setAuthMessage(error.message);
          else setAuthMessage('Success! Check your email configuration values for validation links.');
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: authEmail,

password: authPassword
});
if (error) setAuthMessage(error.message);
}
};
// Feature 3: Sign in with Google Account
const handleGoogleLogin = async () => {
const { error } = await supabase.auth.signInWithOAuth({
provider: 'google',
options: {
redirectTo: window.location.origin + '/story'
}
});
if (error) alert(Google Authentication encountered an error: ${error.message});
};
const handleLogout = async () => {
await supabase.auth.signOut();
};
// Feature 1: Handle Email Preferences Checklist changes
const handleNotificationToggle = async (e) => {
if (!currentUser || !activeStoryId) return;
const checked = e.target.checked;
setNotifyOn(checked);
if (checked) {
await supabase.from('story_subscribers').insert({
story_id: activeStoryId,
user_id: currentUser.id,
email: currentUser.email
});
} else {
await supabase.from('story_subscribers').delete().match({
story_id: activeStoryId,
user_id: currentUser.id
});
}
};
// Feature 2: Claim turn execution statement block
const claimNextTurn = async () => {
if (!currentUser || !activeStoryId) return;
const durationMinutes = 30;
const lockString = new Date(Date.now() + durationMinutes * 60000).toISOString();
const { error } = await supabase
.from('stories')
.update({
claimed_by_user_id: currentUser.id,
claim_expires_at: lockString
})
.eq('id', activeStoryId);
if (error) {
alert('Could not secure turn lock. Someone else may have claimed it.');
} else {
fetchStories();
}
};
// Handle posting turns and safely clear out claims early on success
const postNewTurn = async (e) => {
e.preventDefault();
if (!newTurnText.trim() || !currentUser || !activeStoryId) return;
// 1. Post new block to entries table (triggers automated background email workers)
const { error: entryError } = await supabase.from('story_entries').insert({
story_id: activeStoryId,
author_id: currentUser.id,
author_name: currentUser.user_metadata?.username || currentUser.email.split('@')[0],
content: newTurnText
});
if (entryError) {
alert(Post rejected by engine database checks: ${entryError.message});
return;
}
// 2. Clear out current reservation logs early on success to restore public execution access
await supabase
.from('stories')
.update({
claimed_by_user_id: null,
claim_expires_at: null
})
.eq('id', activeStoryId);
setNewTurnText('');
fetchStories();
};
const createNewStory = async (e) => {
e.preventDefault();
if (!newTitle.trim() || !currentUser) return;
const { data, error } = await supabase.from('stories').insert({
title: newTitle,
description: newDesc,
creator_id: currentUser.id,
limit_type: limitType,
limit_value: parseInt(limitValue),
turn_limit: turnLimit ? parseInt(turnLimit) : null,
visibility: visibility,
turn_order_type: turnOrderType,
consecutive_mode: consecutiveMode,
is_anonymous: isAnonymous,
is_closed: false
}).select().single();
if (error) {
alert(error.message);
} else {
if (initialPrompt.trim() && data) {
await supabase.from('story_entries').insert({
story_id: data.id,
author_id: currentUser.id,
author_name: currentUser.user_metadata?.username || currentUser.email.split('@')[0],
content: initialPrompt
});
}
// Clear layout and return view root
setNewTitle('');
setNewDesc('');
setInitialPrompt('');
setActiveTab('browse');
fetchStories();
}
};
const visibleStories = useMemo(() => {
return stories.filter(s => {
const vis = s.visibility || 'open';
if (vis === 'open' || vis === 'closed') return true;
if (vis === 'hidden') {
if (!currentUser) return false;
return s.creator_id === currentUser.id;
}
return true;
});
}, [stories, currentUser]);
// Figure out if writing screen inputs match lock parameters
const isLockedForMe = useMemo(() => {
if (!activeStory || !activeStory.claim_expires_at) return false;
const isExpired = new Date(activeStory.claim_expires_at).getTime() < Date.now();
if (isExpired) return false;
return activeStory.claimed_by_user_id !== currentUser?.id;
}, [activeStory, currentUser]);
return (

<button
onClick={() => setActiveTab('browse')}
className={slovol-btn ${activeTab === 'browse' ? 'slovol-btn-primary' : ''}}
>
Browse Stories

{currentUser && (
<button
onClick={() => setActiveTab('create')}
className={slovol-btn ${activeTab === 'create' ? 'slovol-btn-primary' : ''}}
>
Create New Story

)}
{currentUser ? (

Logout

) : (
<button onClick={() => setActiveTab('auth')} className="slovol-btn slovol-btn-primary">Login / Sign Up
)}

{!loading && activeTab === 'auth' && (

{/* Feature 3: Integrated Google Authorization Interface Button */}

{isSignUp && (

<input type="text" value={authUsername} onChange={e => setAuthUsername(e.target.value)} className="slovol-input" required />

)}
Email

{authMessage && {authMessage}}

{isSignUp ? 'Register Account' : 'Sign In'}



<button onClick={() => setIsSignUp(!isSignUp)} className="text-sm text-gray-400 hover:underline">
{isSignUp ? 'Already registered? Login instead' : 'Need an account? Sign up here'}



)}
{!loading && activeTab === 'create' && (

Ecosystem Ignition Prompt (First Entry)
<textarea value={initialPrompt} onChange={e => setInitialPrompt(e.target.value)} className="slovol-textarea h-32" placeholder="It began with a spark in the lower transmission core...">

)}
{!loading && activeTab === 'browse' && (

{visibleStories.map(story => (

))}

)}

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // Replace this with the Project URL shown in Supabase: Project Settings > API.
    const SUPABASE_URL = 'https://grqjdubikeedbdisvcpq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wFor1ik9pKpyHeUnojL4Yw_72mgpHfv';
    const supabase = SUPABASE_URL.includes('YOUR_PROJECT_ID')
      ? null
      : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [user, setUser] = useState(null);
      const [stories, setStories] = useState([]);
      const [activeStoryId, setActiveStoryId] = useState(null);
      const [tab, setTab] = useState('browse');
      const [loading, setLoading] = useState(Boolean(supabase));
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');
      const [signUp, setSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [initialPrompt, setInitialPrompt] = useState('');
      const [limitType, setLimitType] = useState('word');
      const [limitValue, setLimitValue] = useState(50);
      const [turnLimit, setTurnLimit] = useState('');
      const [visibility, setVisibility] = useState('open');
      const [turnOrderType, setTurnOrderType] = useState('free');
      const [consecutiveMode, setConsecutiveMode] = useState('not_allowed');
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [turnText, setTurnText] = useState('');
      const [notifyOn, setNotifyOn] = useState(false);

      const activeStory = useMemo(
        () => stories.find(story => story.id === activeStoryId) || null,
        [stories, activeStoryId]
      );
      const visibleStories = useMemo(
        () => stories.filter(story => story.visibility !== 'hidden' || story.creator_id === user?.id),
        [stories, user]
      );

      async function fetchStories() {
        if (!supabase) return;
        const { data, error: fetchError } = await supabase
          .from('stories')
          .select('*, story_entries(*)')
          .order('created_at', { ascending: false });
        if (fetchError) {
          setError(`Could not load stories: ${fetchError.message}`);
          setLoading(false);
          return;
        }
        const formatted = (data || []).map(story => ({
          ...story,
          entries: (story.story_entries || []).sort(
            (a, b) => new Date(a.created_at) - new Date(b.created_at)
          )
        }));
        setStories(formatted);
        setActiveStoryId(current => current || formatted[0]?.id || null);
        setLoading(false);
      }

      useEffect(() => {
        if (!supabase) return undefined;
        fetchStories();
        supabase.auth.getSession().then(({ data, error: sessionError }) => {
          if (sessionError) setError(`Could not check the current session: ${sessionError.message}`);
          setUser(data?.session?.user || null);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!supabase || !user || !activeStoryId) {
          setNotifyOn(false);
          return;
        }
        supabase.from('story_subscribers').select('*')
          .eq('story_id', activeStoryId).eq('user_id', user.id).maybeSingle()
          .then(({ data, error: queryError }) => {
            if (queryError) setError(`Could not check notifications: ${queryError.message}`);
            setNotifyOn(Boolean(data));
          });
      }, [activeStoryId, user]);

      async function handleAuth(event) {
        event.preventDefault();
        setError('');
        setMessage('');
        const result = signUp
          ? await supabase.auth.signUp({ email, password, options: { data: { username } } })
          : await supabase.auth.signInWithPassword({ email, password });
        if (result.error) setError(result.error.message);
        else if (signUp) setMessage('Account created. Check your email if confirmation is enabled.');
        else setTab('browse');
      }

      async function createStory(event) {
        event.preventDefault();
        setError('');
        const { data, error: createError } = await supabase.from('stories').insert({
          title: title.trim(),
          description: description.trim(),
          creator_id: user.id,
          limit_type: limitType,
          limit_value: Number(limitValue),
          turn_limit: turnLimit ? Number(turnLimit) : null,
          visibility,
          turn_order_type: turnOrderType,
          consecutive_mode: consecutiveMode,
          is_anonymous: isAnonymous,
          is_closed: false
        }).select().single();
        if (createError) {
          setError(createError.message);
          return;
        }
        if (initialPrompt.trim()) {
          const { error: entryError } = await supabase.from('story_entries').insert({
            story_id: data.id,
            author_id: user.id,
            author_name: user.user_metadata?.username || user.email.split('@')[0],
            content: initialPrompt.trim()
          });
          if (entryError) setError(`Story created, but the opening turn could not be saved: ${entryError.message}`);
        }
        setTitle('');
        setDescription('');
        setInitialPrompt('');
        setTab('browse');
        await fetchStories();
      }

      async function claimTurn() {
        setError('');
        const claimExpires = new Date(Date.now() + 30 * 60000).toISOString();
        const { error: claimError } = await supabase.from('stories')
          .update({ claimed_by_user_id: user.id, claim_expires_at: claimExpires })
          .eq('id', activeStory.id);
        if (claimError) setError(`Could not claim this turn: ${claimError.message}`);
        else await fetchStories();
      }

      async function postTurn(event) {
        event.preventDefault();
        if (!turnText.trim()) return;
        setError('');
        const { error: entryError } = await supabase.from('story_entries').insert({
          story_id: activeStory.id,
          author_id: user.id,
          author_name: user.user_metadata?.username || user.email.split('@')[0],
          content: turnText.trim()
        });
        if (entryError) {
          setError(`Turn could not be posted: ${entryError.message}`);
          return;
        }
        const { error: releaseError } = await supabase.from('stories')
          .update({ claimed_by_user_id: null, claim_expires_at: null })
          .eq('id', activeStory.id);
        if (releaseError) setError(`Turn posted, but the claim could not be released: ${releaseError.message}`);
        setTurnText('');
        await fetchStories();
      }

      async function toggleNotifications(event) {
        const enabled = event.target.checked;
        setError('');
        const request = enabled
          ? supabase.from('story_subscribers').insert({
            story_id: activeStory.id, user_id: user.id, email: user.email
          })
          : supabase.from('story_subscribers').delete()
            .match({ story_id: activeStory.id, user_id: user.id });
        const { error: notifyError } = await request;
        if (notifyError) {
          setError(`Notification preference was not saved: ${notifyError.message}`);
          setNotifyOn(!enabled);
        } else {
          setNotifyOn(enabled);
        }
      }

      const buttonClass = 'slovol-btn';
      const primaryButtonClass = 'slovol-btn slovol-btn-primary';

      return (
        <main className="app-shell">
          <header className="app-header">
            <div className="brand">Sinvol Chain Stories</div>
            <div className="toolbar">
              <button className={tab === 'browse' ? primaryButtonClass : buttonClass} onClick={() => setTab('browse')}>Browse Stories</button>
              {user && <button className={tab === 'create' ? primaryButtonClass : buttonClass} onClick={() => setTab('create')}>Create Story</button>}
              {user
                ? <><span>{user.user_metadata?.username || user.email}</span><button className={buttonClass} onClick={() => supabase.auth.signOut()}>Log out</button></>
                : <button className={primaryButtonClass} onClick={() => setTab('auth')}>Login / Sign Up</button>}
            </div>
          </header>

          {!supabase && <section className="status">
            <strong>Supabase setup required.</strong> In the file, replace <code>YOUR_PROJECT_ID</code> in
            <code> SUPABASE_URL</code> with your project reference. Find the URL under Supabase
            Project Settings &gt; API. The page is running, but stories and sign-in need this configuration.
          </section>}
          {error && <p className="status error" role="alert">{error}</p>}
          {message && <p className="status" role="status">{message}</p>}

          {tab === 'auth' && supabase && <section className="panel stack">
            <h1>{signUp ? 'Create account' : 'Welcome back'}</h1>
            <button className={buttonClass} onClick={async () => {
              const { error: oauthError } = await supabase.auth.signInWithOAuth({
                provider: 'google', options: { redirectTo: window.location.href }
              });
              if (oauthError) setError(`Google sign-in failed: ${oauthError.message}`);
            }}>Continue with Google</button>
            <form className="stack" onSubmit={handleAuth}>
              {signUp && <label className="field">Username
                <input className="slovol-input" value={username} onChange={event => setUsername(event.target.value)} required />
              </label>}
              <label className="field">Email
                <input className="slovol-input" type="email" value={email} onChange={event => setEmail(event.target.value)} required />
              </label>
              <label className="field">Password
                <input className="slovol-input" type="password" value={password} onChange={event => setPassword(event.target.value)} required />
              </label>
              <button className={primaryButtonClass}>{signUp ? 'Register' : 'Sign in'}</button>
            </form>
            <button className={buttonClass} onClick={() => setSignUp(value => !value)}>
              {signUp ? 'Already registered? Sign in' : 'Need an account? Sign up'}
            </button>
          </section>}

          {tab === 'create' && user && supabase && <form className="panel stack" onSubmit={createStory}>
            <h1>Create a new story</h1>
            <label className="field">Title
              <input className="slovol-input" value={title} onChange={event => setTitle(event.target.value)} required />
            </label>
            <label className="field">Description
              <textarea className="slovol-textarea" value={description} onChange={event => setDescription(event.target.value)} rows="3" />
            </label>
            <label className="field">Turn limit type
              <select className="slovol-select" value={limitType} onChange={event => setLimitType(event.target.value)}>
                <option value="word">Word count</option><option value="character">Character count</option>
              </select>
            </label>
            <label className="field">Maximum length
              <input className="slovol-input" type="number" min="1" value={limitValue} onChange={event => setLimitValue(event.target.value)} required />
            </label>
            <label className="field">Total turn limit (optional)
              <input className="slovol-input" type="number" min="1" value={turnLimit} onChange={event => setTurnLimit(event.target.value)} />
            </label>
            <label className="field">Visibility
              <select className="slovol-select" value={visibility} onChange={event => setVisibility(event.target.value)}>
                <option value="open">Open</option><option value="closed">Closed</option><option value="hidden">Hidden (creator only)</option>
              </select>
            </label>
            <label className="field">Turn order
              <select className="slovol-select" value={turnOrderType} onChange={event => setTurnOrderType(event.target.value)}>
                <option value="free">Free for all</option><option value="round_robin">Round robin</option>
              </select>
            </label>
            <label className="field">Consecutive contributions
              <select className="slovol-select" value={consecutiveMode} onChange={event => setConsecutiveMode(event.target.value)}>
                <option value="not_allowed">Block back-to-back entries</option><option value="allowed">Allow consecutive entries</option>
              </select>
            </label>
            <label><input type="checkbox" checked={isAnonymous} onChange={event => setIsAnonymous(event.target.checked)} /> Anonymous story</label>
            <label className="field">Opening turn (optional)
              <textarea className="slovol-textarea" value={initialPrompt} onChange={event => setInitialPrompt(event.target.value)} rows="4" />
            </label>
            <button className={primaryButtonClass}>Create story</button>
          </form>}

          {tab === 'browse' && <div>
            {loading && <p className="muted">Loading stories...</p>}
            {!loading && supabase && <div className="layout">
              <aside className="panel">
                <h2>Stories</h2>
                {visibleStories.length === 0
                  ? <p className="muted">No stories yet. Sign in to create one.</p>
                  : <div className="story-list">{visibleStories.map(story =>
                    <button key={story.id} className={`slovol-card story-card${story.id === activeStoryId ? ' active' : ''}`} onClick={() => setActiveStoryId(story.id)}>
                      <strong>{story.title}</strong>
                      <p className="muted">{story.entries.length} {story.entries.length === 1 ? 'turn' : 'turns'}</p>
                      <p>{story.description || 'No description'}</p>
                    </button>
                  )}</div>}
                <button className={buttonClass} onClick={fetchStories}>Refresh</button>
              </aside>
              <section className="panel">
                {activeStory ? <>
                  <div className="story-heading"><div><h1>{activeStory.title}</h1><p className="muted">{activeStory.description}</p></div></div>
                  {user && <label><input type="checkbox" checked={notifyOn} onChange={toggleNotifications} /> Notify me about new turns</label>}
                  <div>{activeStory.entries.length
                    ? activeStory.entries.map((entry, index) => <article className="entry" key={entry.id || `${entry.created_at}-${index}`}>
                      <div className="entry-meta"><span>Turn #{index + 1} — {entry.author_name}</span><span>{new Date(entry.created_at).toLocaleString()}</span></div>
                      <p>{entry.content}</p>
                    </article>)
                    : <p className="muted">This story has no turns yet.</p>}
                  </div>
                  {user && <div className="stack">
                    {activeStory.claim_expires_at && new Date(activeStory.claim_expires_at) > new Date() && activeStory.claimed_by_user_id !== user.id
                      ? <p className="status">This turn is claimed until {new Date(activeStory.claim_expires_at).toLocaleTimeString()}.</p>
                      : <>
                        <button className={buttonClass} onClick={claimTurn}>Claim next turn for 30 minutes</button>
                        <form className="stack" onSubmit={postTurn}>
                          <label className="field">Your next turn ({activeStory.limit_value} {activeStory.limit_type}s max)
                            <textarea className="slovol-textarea" value={turnText} onChange={event => setTurnText(event.target.value)} rows="5" required />
                          </label>
                          <button className={primaryButtonClass}>Post turn</button>
                        </form>
                      </>}
                  </div>}
                </> : <p className="muted">Select a story to read it.</p>}
              </section>
            </div>}
          </div>}
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  </body>
  </html>
